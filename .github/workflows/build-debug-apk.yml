name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  build:
    name: Assemble and publish a draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK after the branch and the commit
        id: apk
        run: |
          mkdir -p out
          NAME="kotatsu-redo-debug-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # A draft release is visible only to people with write access and, unlike a published
      # pre-release, does not trigger the Discord release webhook.
      - name: Publish the APK as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_SHA::7}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "out/${{ steps.apk.outputs.name }}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Debug build: ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --notes "Debug build of \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA::7}\`.

          The application id is \`io.github.kotatsuredo.kotatsu.debug\`, so it installs next to a
          regular Kotatsu Redo instead of replacing it. It is a debug build: not minified, larger
          and slower than a release one, and it does not receive in-app updates."
